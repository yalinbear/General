<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#36454f">
<title>House 2D 平面（手機版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;color:#212121;background:#eef1f4}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:0 0 auto;background:#36454f;color:#fff;padding:9px 13px;padding-top:max(9px,env(safe-area-inset-top));
  display:flex;justify-content:space-between;align-items:center}
header b{font-size:14.5px}
header span{font-size:11.5px;opacity:.85}
#map{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block;background:#eef1f4}
#scalebar{position:absolute;left:9px;bottom:9px;background:rgba(255,255,255,.94);border:1px solid #d8dde1;border-radius:6px;
  padding:4px 8px;font-size:10.5px;color:#36454f;pointer-events:none}
/* ---- panel (in-flow, below map) ---- */
#panel{flex:0 0 auto;background:#fff;border-top:1px solid #d8dde1;display:none;flex-direction:column;
  box-shadow:0 -3px 12px rgba(0,0,0,.10)}
#panel.show{display:flex}
.ph{position:relative;display:flex;align-items:baseline;gap:8px;padding:11px 12px 5px;border-bottom:1px solid #eceff1;touch-action:none}
.ph .grip{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:#d8dde1}
.ph b{font-size:15.5px;white-space:nowrap}
.ph i{font-style:normal;font-size:11.5px;color:#7a8791;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .x{font-size:19px;color:#7a8791;padding:0 2px 0 6px;line-height:1}
/* 四個分頁統一高度＝區塊 4 列（164px），內容超過就在面板內滑動 */
.pb{height:164px;overflow-y:auto;padding:6px 12px calc(6px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.kv{display:flex;gap:8px;margin:2px 0 7px}
.kv div{flex:1;background:#f2f2f2;border-radius:8px;padding:5px 10px;display:flex;align-items:baseline;gap:6px}
.kv div.r{background:#fdecea}
.kv b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.15}
.kv small{color:#7a8791;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#36454f;color:#fff;padding:3px 6px;text-align:left;font-weight:600}
td{border-bottom:1px solid #eceff1;padding:3px 6px;line-height:1.35}
td.n{text-align:center;font-variant-numeric:tabular-nums}
.note{margin-top:6px;font-size:11px;color:#7a8791;line-height:1.5}
.chk{display:flex;align-items:center;gap:7px;font-size:12.8px;padding:5px 2px;line-height:1.25;
     border-bottom:1px solid #f4f6f7}
.chk input{width:17px;height:17px;flex:0 0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.g2 .ri{font-size:13.5px;padding:8px 4px}
.ri{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;font-size:14.5px;border-bottom:1px solid #f4f6f7}
.ri.sel{background:#fdecea;border-radius:7px}
.ri span{color:#c0392b;font-weight:700;font-variant-numeric:tabular-nums}
/* ---- bottom nav ---- */
nav{flex:0 0 auto;display:flex;align-items:stretch;background:#fff;border-top:1px solid #d8dde1;
  padding-bottom:env(safe-area-inset-bottom)}
nav .tab{flex:1;text-align:center;padding:10px 2px;font-size:13px;color:#7a8791;font-weight:600}
nav .tab.on{color:#c0392b;box-shadow:inset 0 -3px 0 #c0392b}
nav .sp{width:1px;background:#e6eaed;margin:7px 4px}
nav .nb{width:42px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#36454f}
nav .nb.on{color:#fff;background:#c0392b}
.rlab{font-size:26px;font-weight:700;fill:#36454f;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:6px}
.rar{font-size:21px;fill:#c0392b;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:6px}
.rp{fill:#2f7dbd;fill-opacity:.10;stroke:#2f7dbd;stroke-width:2;stroke-opacity:.55}
.rp.sel{fill:#c0392b;fill-opacity:.22;stroke:#c0392b;stroke-width:4}
</style></head><body>

let sel=-1;
function drawEdges(r){
  if(!LST.L_edge){gE.innerHTML='';return;}
  const P=r.poly,n=P.length;let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=n;cy/=n;let h='';
  for(let k=0;k<n;k++){const a=P[k],b=P[(k+1)%n];const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
    if(len<3)continue;const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    let ux=cx-mx,uy=cy-my;const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;const off=len>60?26:34;
    const tx=mx+ux*off,ty=my+uy*off;let ang=Math.atan2(dy,dx)*180/Math.PI;if(ang>90||ang<-90)ang+=180;
    h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#c0392b" stroke-width="4" stroke-opacity=".85"/>`;
    h+=`<circle cx="${a[0]}" cy="${a[1]}" r="6" fill="#c0392b"/>`;
    h+=`<text x="${tx}" y="${ty}" font-size="${len>120?26:22}" font-weight="700" fill="#c0392b" text-anchor="middle" dominant-baseline="central" paint-order="stroke" stroke="#fff" stroke-width="7" transform="rotate(${ang.toFixed(1)} ${tx} ${ty})">${len.toFixed(1)}</text>`;}
  gE.innerHTML=h;
}

    el.addEventListener('touchend',end);});
})();

function bbox(r){const xs=r.poly.map(p=>p[0]),ys=r.poly.map(p=>p[1]);
  return{x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};}
function centerOn(r){const b=bbox(r);
  vb.x=(b.x0+b.x1)/2-vb.w/2; vb.y=(b.y0+b.y1)/2-vb.h/2; applyVB();}
function zoomTo(r){const b=bbox(r);
  const m=Math.max(b.x1-b.x0,b.y1-b.y0)*0.28+50;
  vb={x:b.x0-m,y:b.y0-m,w:(b.x1-b.x0)+2*m,h:(b.y1-b.y0)+2*m};
  const ar=svg.clientWidth/svg.clientHeight;
  if(vb.w/vb.h<ar){const nw=vb.h*ar;vb.x-=(nw-vb.w)/2;vb.w=nw;}else{const nh=vb.w/ar;vb.y-=(nh-vb.h)/2;vb.h=nh;}
  applyVB();}

}
// ---- touch ----
function toWorld(cx,cy){const r=svg.getBoundingClientRect();
  return{x:vb.x+(cx-r.left)/r.width*vb.w, y:vb.y+(cy-r.top)/r.height*vb.h};}
let t0=null,pinch=null,moved=0,tStart=0;
const map=document.getElementById('map');
map.addEventListener('touchstart',e=>{
  if(e.touches.length===1){t0=toWorld(e.touches[0].clientX,e.touches[0].clientY);moved=0;tStart=Date.now();pinch=null;}
  else if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
           c:toWorld((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2),vb:{...vb}};t0=null;}
},{passive:false});
map.addEventListener('touchmove',e=>{e.preventDefault();
  if(pinch&&e.touches.length===2){const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const f=Math.max(.15,Math.min(8,pinch.d/d));
    vb.w=pinch.vb.w*f; vb.h=pinch.vb.h*f;
    vb.x=pinch.c.x-(pinch.c.x-pinch.vb.x)*f; vb.y=pinch.c.y-(pinch.c.y-pinch.vb.y)*f; applyVB();
  } else if(t0&&e.touches.length===1){
    const p=toWorld(e.touches[0].clientX,e.touches[0].clientY);
    vb.x-=p.x-t0.x; vb.y-=p.y-t0.y; moved+=Math.abs(p.x-t0.x)+Math.abs(p.y-t0.y); applyVB();}
},{passive:false});
map.addEventListener('touchend',e=>{
  if(t0&&moved<12&&Date.now()-tStart<400&&e.changedTouches.length){
    const t=e.changedTouches[0];
    if(measuring){const p=toWorld(t.clientX,t.clientY);
      if(mp.length===0)mp=[p];else{done.push([mp[0],p]);mp=[];}render();}
    else{const el=document.elementFromPoint(t.clientX,t.clientY);
      if(el&&el.dataset&&el.dataset.i!==undefined)select(+el.dataset.i,false);
      else if(!(el&&el.closest&&(el.closest('.fu')||el.closest('.fbtn'))))deselect();}
  }
  t0=null;pinch=null;
});
// ---- measure ----
let measuring=false,mp=[],done=[];
document.getElementById('fMea').onclick=e=>{measuring=!measuring;
  e.currentTarget.classList.toggle('on',measuring);
  if(!measuring)mp=[];else done=[];render();};
function seg(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#c0392b" stroke-width="3"/>`+
  `<circle cx="${a.x}" cy="${a.y}" r="6" fill="#c0392b"/><circle cx="${b.x}" cy="${b.y}" r="6" fill="#c0392b"/>`+
  `<text x="${mx}" y="${my-12}" font-size="28" fill="#c0392b" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="8">${d.toFixed(1)} cm</text>`;}
function render(){gm.innerHTML=done.map(d=>seg(d[0],d[1])).join('')+
  (mp.length?`<circle cx="${mp[0].x}" cy="${mp[0].y}" r="7" fill="none" stroke="#c0392b" stroke-width="3"/>`:'');}
// ---- view buttons ----
function fit(){vb={x:-40,y:-40,w:DATA.w+80,h:DATA.h+80};
  const ar=svg.clientWidth/svg.clientHeight;
  if(vb.w/vb.h<ar){const nw=vb.h*ar;vb.x-=(nw-vb.w)/2;vb.w=nw;}else{const nh=vb.w/ar;vb.y-=(nh-vb.h)/2;vb.h=nh;}
  LAST=[svg.clientWidth,svg.clientHeight]; applyVB();}
// 面板開啟時：維持原比例尺（不縮放），並把平面圖頂端貼齊可視區上緣
let LAST=[0,0];
function topAlign(){
  const w=svg.clientWidth,h=svg.clientHeight;
  if(!w||!h) return;
  const s=w/vb.w;                       // 目前的 px/cm，寬度方向不變
  vb.h=h/s;
  vb.y=-40;                             // 平面圖上緣（含 40cm 邊界）貼齊頂部
  LAST=[w,h]; applyVB();
}
document.getElementById('fFit').onclick=()=>fit();
document.getElementById('fIn').onclick=()=>{const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w/=1.4;vb.h/=1.4;vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;applyVB();};
document.getElementById('fOut').onclick=()=>{const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w*=1.4;vb.h*=1.4;vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;applyVB();};
window.addEventListener('resize',()=>setTimeout(applyVB,60));
window.addEventListener('orientationchange',()=>setTimeout(fit,300));
applyLayers(); fit();
</script></body></html>
